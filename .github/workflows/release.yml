name: Release

# Runs after CI, so only a commit that passed every test on main gets released.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the next version
        run: |
          released=$(git tag --points-at "$COMMIT" --list 'v*')
          if [[ -n $released ]]; then
            echo "$COMMIT is already released as $released"
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [[ -z $latest ]]; then
            version=v0.1.0
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            version="v$major.$minor.$((patch + 1))"
          fi

          sed -i "s/^readonly VERSION=dev\$/readonly VERSION=$version/" server.sh client.sh
          sed -i "s/^\\\$Version = 'dev'/\\\$Version = '$version'/" client.ps1
          grep -q "^readonly VERSION=$version\$" server.sh
          grep -q "^readonly VERSION=$version\$" client.sh
          grep -q "^\\\$Version = '$version'" client.ps1

          sha256sum server.sh client.sh client.ps1 >SHA256SUMS
          gh release create "$version" server.sh client.sh client.ps1 SHA256SUMS \
            --target "$COMMIT" --title "$version" --generate-notes
